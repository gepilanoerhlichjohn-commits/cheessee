name: Build Cheessee APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      stockfish_tag:
        description: "Stockfish version to build (older = lighter for slow phones)"
        default: "sf_15.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chess rules, hints, labels, threats and the screen reader are tested here.
      # A failure shows a warning but does not stop the APK from being built.
      - name: Self-tests
        continue-on-error: true
        run: ./tools/run-tests.sh

      - name: Build Stockfish for Android (64-bit and 32-bit)
        run: |
          TAG="${{ github.event.inputs.stockfish_tag }}"
          TAG="${TAG:-sf_15.1}"
          git clone --depth 1 --branch "$TAG" https://github.com/official-stockfish/Stockfish.git sf
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          echo "Using NDK at $NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cd sf/src
          build() {
            ARCH="$1"; ABI="$2"; CXXNAME="$3"
            make clean >/dev/null 2>&1 || true
            if make -j4 build ARCH="$ARCH" COMP=ndk CXX="$CXXNAME" STRIP=true; then
              mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI"
              cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libstockfish.so"
              llvm-strip "$GITHUB_WORKSPACE/app/src/main/jniLibs/$ABI/libstockfish.so" || true
              echo "built $ABI"
            else
              echo "::warning::Stockfish build failed for $ABI"
            fi
          }
          build armv8 arm64-v8a aarch64-linux-android21-clang++
          build armv7-neon armeabi-v7a armv7a-linux-androideabi21-clang++
          ls -la "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/ || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Cheessee-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # Easy download from a phone: Releases page -> Cheessee.apk
      - name: Publish download link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cheessee.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Cheessee.apk --target "$GITHUB_SHA" \
            --title "Cheessee (latest build)" \
            --notes "Download Cheessee.apk, install it, then follow README.md."
